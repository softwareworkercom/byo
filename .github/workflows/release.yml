name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3).'
        required: true
      publish:
        description: 'Publish a GitHub Release. Set to false for a build-only dry-run.'
        type: boolean
        required: false
        default: true

permissions:
  contents: write # required to create GitHub Releases and upload assets

env:
  CLI_PROJECT: src/SoftwareWorker.BYO.CLI/SoftwareWorker.BYO.CLI.csproj
  BIN_NAME: byo

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ''
            archive: tar.gz
          - rid: osx-x64
            os: macos-13  # Intel
            ext: ''
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest  # Apple Silicon
            ext: ''
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Publish self-contained binary
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish "${CLI_PROJECT}" \
            --configuration Release \
            --runtime "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:DebugType=embedded \
            -p:Version=${VERSION} \
            -p:InformationalVersion=${VERSION}+sha.${GITHUB_SHA} \
            -p:PackAsTool=false \
            --output "publish/${RID}"

      - name: Smoke test (same-arch runners only)
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.ext }}
        run: |
          "./publish/${RID}/${BIN_NAME}${EXT}" --help || \
          "./publish/${RID}/${BIN_NAME}${EXT}" --version || true

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist
          NAME="byo-${VERSION}-${RID}"
          # Stage only the binary (and adjacent native libs if any) at the archive root
          STAGE="staging/${RID}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          cp "publish/${RID}/${BIN_NAME}${EXT}" "${STAGE}/"
          # Include LICENSE and README at archive root for discoverability
          cp LICENSE "${STAGE}/" 2>/dev/null || true
          cp README.md "${STAGE}/" 2>/dev/null || true

          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd "${STAGE}" && 7z a -tzip -mx=9 "../../dist/${NAME}.zip" .)
          else
            tar -czf "dist/${NAME}.tar.gz" -C "${STAGE}" .
          fi
          ls -la dist

      - name: Generate SHA256 checksums
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${RID}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${RID}.txt"
          fi
          cat "SHA256SUMS-${RID}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: byo-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          path: artifacts
          pattern: byo-*
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd artifacts
          # Merge per-RID checksum files into a single SHA256SUMS.txt and remove the per-RID ones
          cat SHA256SUMS-*.txt | grep -v 'SHA256SUMS' | sort -u > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          echo "Final checksums:"
          cat SHA256SUMS.txt
          ls -la

      - name: Stage installer scripts (for one-liner install from the release)
        run: |
          cp installers/install.sh  artifacts/install.sh  || true
          cp installers/install.ps1 artifacts/install.ps1 || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          body_path: .github/RELEASE_TEMPLATE.md
          fail_on_unmatched_files: true
