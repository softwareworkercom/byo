# Configuration for GitHub's auto-generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
    - title: 🚀 Features
      labels: [feature, enhancement]
    - title: 🐛 Bug Fixes
      labels: [bug, fix]
    - title: ⚠️ Breaking Changes
      labels: [breaking, breaking-change]
    - title: 🧰 Maintenance
      labels: [chore, refactor, ci, dependencies]
    - title: 📚 Documentation
      labels: [docs, documentation]
    - title: 🔬 Other Changes
      labels: ["*"]
  exclude:
    labels: [skip-changelog, ignore-for-release]
    authors: [dependabot]
